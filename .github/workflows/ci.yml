name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: requirements.lock

      - name: Install pinned environment (Python 3.11)
        run: |
          uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python -r requirements.lock

      - name: Lint
        run: make lint

      # ast2vec (external code + pickled model) is not fetched in CI; the
      # tests cover everything except the ast2vec encoding call.
      - name: Tests
        env:
          MPLBACKEND: Agg
        run: .venv/bin/python -m pytest -v
